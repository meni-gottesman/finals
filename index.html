<style>

details.day{border-top:1px solid var(--rule);padding:6px 0}details.day summary{cursor:pointer;font-weight:600;padding:6px 0;display:flex;gap:8px}
details.day summary .dm{margin-left:auto;font-weight:400;color:var(--muted);font-size:.82rem}
.trow{display:flex;gap:8px;align-items:baseline;font-size:.9rem;margin:5px 0 5px 4px}
.trow .ic{width:18px;flex:none;text-align:center}.trow.done{color:var(--muted)}.trow.cur{font-weight:700}
.player .pgrid{display:block}
.pside .pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pills button{min-width:40px;min-height:36px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:700 .85rem system-ui;cursor:pointer}
.pills button.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.pills button.cur{outline:2px solid var(--accent)}
.stext{font-size:1.02rem;margin:8px 0}
.pmat{margin-top:12px}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.mtabs button{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font:600 .82rem system-ui;cursor:pointer}
.mtabs button.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
iframe.mat{width:100%;height:72vh;border:1px solid var(--rule);border-radius:12px;background:#fff}
.nomat{border:1px dashed var(--rule);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
.ptime{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;color:var(--muted)}

@media (min-width:1100px){
  .player .pgrid{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:18px;align-items:start}
  .pmat{margin-top:0;position:sticky;top:12px}
  iframe.mat{height:calc(100vh - 90px)}
}
footer{margin-top:28px;font-size:.8rem;color:var(--muted)}

<body>
<div class="wrap">
  <div class="top"><h1 id="h">Finals</h1><a href="#" id="homeLink">Course home</a><a href="#" id="schedLink">Schedule</a><a href="#" id="logLink">Error log</a></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="meta"><span id="m1"></span><span id="m2"></span></div>
  <div id="main"></div>
  <div id="viewer" hidden><div class="vbar"><button id="vback">← Back to task</button><button id="vprev" title="Previous page">‹</button><span id="vtitle"></span></div><iframe id="vframe" title="Study material"></iframe><div id="vblock" hidden></div></div>
  <footer>Questions are generated fresh every attempt, so memorized answers don’t carry over. Progress is saved in this browser on this device.</footer>
</div>
<script src="plan-data.js"></script>
<script src="gen54.js"></script>
<script src="gen55.js"></script>
<script src="gen61b.js"></script>
<script>
"use strict";
const P=window.PLAN, G=window.GEN||{};
const KEY='finals-app-v2';
let S={done:{},start:{},err:[],check:{},notes:[],q:null,days:{},ahead:{},steps:{},hlog:{},redo:[],pos:{},scroll:{},tab:{}};
try{ S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
S.steps=S.steps||{}; S.hlog=S.hlog||{}; S.redo=S.redo||[]; S.pos=S.pos||{}; S.scroll=S.scroll||{}; S.tab=S.tab||{};
let VIEW='home';
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
const $=id=>document.getElementById(id);
const TAG={'54':'<span class="tag t54">Math 54</span>','55':'<span class="tag t55">Math 55</span>','B':'<span class="tag tB">CS 61B</span>','A':'<span class="tag tA">All</span>'};
const OVR=new URLSearchParams(location.search).get('date');
const today=()=>{if(OVR&&/^\d{4}-\d{2}-\d{2}$/.test(OVR))return OVR;const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const dateOf=ms=>{const t=new Date(ms);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fm=m=>m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- RNG ----------
function makeRng(seed){ let a=seed>>>0||1;
  const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const r={float:f,int:(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)),pick:a=>a[Math.floor(f()*a.length)],bool:()=>f()<.5,
    shuffle:a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}};
  r.sample=(a,k)=>r.shuffle(a).slice(0,k); return r; }
const freshSeed=()=>{const u=new Uint32Array(1);(crypto||window.msCrypto).getRandomValues(u);return u[0];};

// ---------- answer checking ----------
function parseNum(s){ s=String(s).trim().replace(/−/g,'-').replace(/\s+/g,'');
  if(!s) return NaN;
  let m=s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/); if(m) return parseFloat(m[1])/parseFloat(m[2]);
  if(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)) return parseFloat(s);
  return NaN; }
function numEq(given,ans){ const a=typeof ans==='string'?parseNum(ans):ans, g=parseNum(given);
  if(!isFinite(g)||!isFinite(a)) return false;
  const exact=typeof ans==='string'||Number.isInteger(a)||Math.abs(a*1e4-Math.round(a*1e4))<1e-7;
  if(Number.isInteger(a)) return Math.abs(g-a)<1e-9;
  return exact? Math.abs(g-a)<=1e-9*Math.max(1,Math.abs(a)) : Math.abs(g-a)<=5e-4*Math.max(1,Math.abs(a)); }
const norm=s=>String(s).toLowerCase().replace(/<[^>]+>/g,'').replace(/[\s·*]/g,'').replace(/θ/g,'θ');
function check(Q,input){
  switch(Q.kind){
    case 'num': return numEq(input,Q.answer);
    case 'list': { const g=String(input).split(/[,;\s]+/).filter(Boolean); const a=Q.answer.slice();
      if(g.length!==a.length) return false;
      if(Q.unordered){ const gs=g.map(parseNum).sort((x,y)=>x-y), as=a.map(x=>typeof x==='string'?parseNum(x):x).sort((x,y)=>x-y); return gs.every((v,i)=>numEq(String(v),as[i])); }
      return g.every((v,i)=>numEq(v,a[i])); }
    case 'mc': return Number(input)===Q.answer;
    case 'multi': { const g=(input||[]).slice().sort(), a=Q.answer.slice().sort(); return g.length===a.length&&g.every((v,i)=>v===a[i]); }
    case 'tf': return input===Q.answer;
    case 'text': { const g=norm(input); return (Array.isArray(Q.answer)?Q.answer:[Q.answer]).some(a=>norm(a)===g); }
  } return false; }

// ---------- generators ----------
const gensFor=(unit,type)=>(G[unit]||[]).filter(g=>!type||g.type===type);
function makeQ(unit,type,genId){
  let gens=genId?(G[unit]||[]).filter(g=>g.id===genId):gensFor(unit,type);
  if(!gens.length) gens=gensFor(unit); if(!gens.length) return null;
  for(let tries=0;tries<20;tries++){
    const g=makeRng(freshSeed()).pick(gens);
    try{ const Q=g.make(makeRng(freshSeed())); if(Q&&Q.prompt){ delete Q._d; delete Q._chk; delete Q._java; delete Q.meta; Q.gen=g.id; Q.unit=unit; Q.type=g.type;
      if(Q.kind==='mc'){ const order=makeRng(freshSeed()).shuffle(Q.choices.map((c,i)=>i)); Q.order=order; }
      return JSON.parse(JSON.stringify(Q)); } }catch(e){ console.warn(g.id,e); } }
  return null; }
const typesWithGens=unit=>[...new Set((G[unit]||[]).map(g=>g.type))];

// ---------- queue + adaptive schedule ----------
// Tasks run in plan order, each on its plan day. Anything unfinished rolls over to the next day,
// ahead of that day's own tasks, until the student is back on track (the student's rule, Nov 27).
// Finishing early lets them work ahead; tasks done ahead simply disappear from their later day.
const LEARN_END='2026-12-07', MOCK_END='2026-12-13';
const PLAN_START=P.days[0].d;
let _all=null;
// Task keys follow content (unit), so reordering the plan never mixes up progress.
const taskKey=(day,t,i)=>(t.t==='L'||t.t==='H')?t.t+':'+t.u:(t.t==='R'?'R:'+day.d:day.d+'#'+i);

    const tasks=[]; let a=0;
    while(i<rem.length && (!tasks.length || a+(rem[i].min||0)/2<=target)){ tasks.push(rem[i]); a+=rem[i].min||0; i++; }
    out.push({d:day,tasks}); day=addDays(day,1); }

function renderCheck(t,head){
  const C=S.check[t.key]; const reqs=C.reqs||[];

  $('main').innerHTML=`<div class="banner info">Each task stays on its plan day. Unfinished tasks roll over to the next day, ahead of that day’s own tasks; tasks you do ahead disappear from their later day. Today shows everything due so far.</div>
    ${list.length?row(td,list,true):''}${fut.map(x=>row(x.d,x.tasks,false)).join('')}
    <div class="card">${exams.map(k=>`<p>🎯 ${fmt(k.d)} · ${esc(k.title)}</p>`).join('')}</div>
    <button class="btn sec" id="back">Back to today</button>`;
  $('back').onclick=render; window.scrollTo(0,0); }
$('schedLink').onclick=e=>{ e.preventDefault(); showSchedule(); };
$('homeLink').onclick=e=>{ e.preventDefault(); VIEW='home'; closeViewer(); render(); window.scrollTo(0,0); };
$('h').style.cursor='pointer'; $('h').onclick=()=>$('homeLink').click();
$('logLink').onclick=e=>{ e.preventDefault(); clearInterval(tick);
  const open=S.err.filter(x=>!x.cleared);
  $('main').innerHTML=`<div class="card"><h2>Error log</h2><p class="small">Every wrong answer comes back with fresh numbers in 2 and 7 days. It clears after you get it right twice.</p>
   ${open.length?'<ul>'+open.map(x=>`<li>${esc(P.U[x.unit]?P.U[x.unit].n:x.unit)} · ${esc(x.type||'missed on a timed exam')} · due ${fmt(x.due)}</li>`).join('')+'</ul>':'<p>Empty.</p>'}
   <h2>Redo-cold list</h2>${S.redo.filter(r=>!r.cleared).length?'<ul>'+S.redo.filter(r=>!r.cleared).map(r=>`<li>${esc(r.label)} · due ${fmt(r.due)}${r.tries?' · tried '+r.tries+'×':''}</li>`).join('')+'</ul>':'<p>Empty.</p>'}<p class="small">Cleared: ${S.redo.filter(r=>r.cleared).length}</p>
   <h2>Your notes</h2>${S.notes.slice(-30).reverse().map(n=>`<p class="small"><b>${fmt(n.d)} · ${esc(n.title)}</b>${n.att?` · ${n.cor}/${n.att} correct`:''}${n.tot?` · ${n.pts}/${n.tot} pts`:''}<br>${esc(n.why||'')}</p>`).join('')||'<p>None yet.</p>'}
   <button class="btn sec" id="back">Back to today</button></div>`;
  $('back').onclick=render; };
// ---------- built-in viewer: every link opens inside the app ----------
const VSTACK=[]; let PDFPAGE=null;
function embedURL(u){ let x; try{ x=new URL(u,location.href); }catch(e){ return null; }
  if(x.protocol==='http:') x.protocol='https:';
  const h=x.hostname;
  const isPdf=/\.pdf$/i.test(x.pathname)||/tbp\.studentorg\.berkeley\.edu$/.test(h);
  const nativePdf=navigator.pdfViewerEnabled!==false && !matchMedia('(pointer:coarse)').matches && x.origin!==location.origin && !/tbp\.studentorg/.test(h);
  if(isPdf && x.origin!==location.origin && !nativePdf){ const pg=(x.hash.match(/page=(\d+)/)||[])[1]; if(pg) PDFPAGE=pg;
    return 'https://docs.google.com/viewer?embedded=true&url='+encodeURIComponent(x.origin+x.pathname+x.search); }
  if(/youtube\.com$|youtu\.be$/.test(h)){ const id=h.includes('youtu.be')?x.pathname.slice(1):(x.searchParams.get('v')||x.pathname.split('/').pop());
    const t=x.searchParams.get('t'); const st=t?parseInt(t,10):0; return 'https://www.youtube-nocookie.com/embed/'+id+(st?'?start='+st:''); }
  if(/bcourses\.berkeley\.edu$|instructure\.com$|drive\.google\.com$|accounts\.google\.com$|gradescope\.com$|edstem\.org$/.test(h) || (h==='docs.google.com'&&!x.pathname.startsWith('/viewer'))) return null;
  return x.href; }
function showV(entry){ const v=$('viewer'), f=$('vframe'), b=$('vblock'); v.hidden=false; document.body.classList.add('split');
  $('vtitle').textContent=entry.title||entry.url; $('vprev').disabled=VSTACK.length<2;
  const e=embedURL(entry.url);
  if(e){ b.hidden=true; f.hidden=false; if(f.dataset.src!==e){ f.dataset.src=e; f.src=e; }
    if(/docs\.google\.com\/viewer/.test(e)) $('vtitle').textContent=(entry.title||'PDF')+(PDFPAGE?' · go to page '+PDFPAGE:'')+' · loading can take ~10 s'; PDFPAGE=null; }
  else { f.hidden=true; f.removeAttribute('src'); f.dataset.src=''; b.hidden=false;
    b.innerHTML=`<p><b>${esc(entry.title||'This page')}</b> is on a site that refuses to be shown inside other pages (and needs your login), so it can’t open here.</p><p class="small">${esc(entry.url)}</p><button class="btn sec" id="vext">Open it in the browser instead</button>`;
    $('vext').onclick=()=>window.open(entry.url,'_blank','noopener'); } }
function openViewer(url,title){ try{ const x=new URL(url,location.href); if(x.origin===location.origin&&/\/finals\/(index\.html)?$/.test(x.pathname)){ closeViewer(); return; } }catch(e){}
  VSTACK.push({url,title:(title||'').trim().slice(0,80)}); showV(VSTACK[VSTACK.length-1]); }
function closeViewer(){ VSTACK.length=0; $('viewer').hidden=true; document.body.classList.remove('split'); const f=$('vframe'); f.removeAttribute('src'); f.dataset.src='';
  window.dispatchEvent(new Event('focus')); }
$('vback').onclick=closeViewer;
$('vprev').onclick=()=>{ if(VSTACK.length>1){ VSTACK.pop(); showV(VSTACK[VSTACK.length-1]); } };
const linkHandler=e=>{ const a=e.target.closest&&e.target.closest('a[href]'); if(!a) return; const h=a.getAttribute('href');
  if(!h||h.startsWith('#')||h.startsWith('javascript:')||a.closest('.vbar')) return;
  const mf=$('matframe'); if(mf&&a.closest('.pside')){ e.preventDefault(); const u=embedURL(a.href); if(u){ mf.src=u; wireFrame(mf,a.href); return; } }
  e.preventDefault(); openViewer(a.href,a.textContent); };
document.addEventListener('click',linkHandler);
$('vframe').addEventListener('load',()=>{ try{ const d=$('vframe').contentDocument; if(!d||!d.body) return;
  d.addEventListener('click',ev=>{ const a=ev.target.closest&&ev.target.closest('a[href]'); if(!a) return; const h=a.getAttribute('href')||'';
    if(h.startsWith('#')||h.startsWith('javascript:')) return; ev.preventDefault(); openViewer(a.href,a.textContent); });
  const t=d.title; if(t&&VSTACK.length) $('vtitle').textContent=t; }catch(e){} });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('viewer').hidden) closeViewer(); });
render();
</script>
