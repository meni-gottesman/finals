<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315773a'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EA%3C/text%3E%3C/svg%3E">
<title>Finals Prep</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--ink:#16202c;--muted:#5b6677;--rule:#dfe3ea;--accent:#1f4cc9;--accent-bg:#ecf1ff;--on-accent:#fff;--ok:#127a3a;--ok-bg:#e9f7ee;--on-ok:#fff;--bad:#b42323;--bad-bg:#fff0ef;--warn:#9a4c08;--warn-bg:#fff5e8;
--c54:#7a3fb8;--c54-bg:#f3ecfc;--c55:#1f4cc9;--c55-bg:#ecf1ff;--cB:#127a3a;--cB-bg:#e9f7ee;--cA:#5b6677;--cA-bg:#eef0f4;--code:#f2f4f8;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--math:"STIX Two Text","Cambria Math",Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--surface:#171c23;--ink:#e7ebf1;--muted:#a3adbb;--rule:#2b333e;--accent:#8fb0ff;--accent-bg:#1b2540;--on-accent:#0f1318;--ok:#7fd39b;--ok-bg:#15261b;--on-ok:#0f1318;--bad:#ff9a95;--bad-bg:#2d1718;--warn:#f2b26b;--warn-bg:#2a2016;
--c54:#c9a2f5;--c54-bg:#251c33;--c55:#8fb0ff;--c55-bg:#1b2540;--cB:#7fd39b;--cB-bg:#15261b;--cA:#a3adbb;--cA-bg:#222a35;--code:#1d232c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--surface:#171c23;--ink:#e7ebf1;--muted:#a3adbb;--rule:#2b333e;--accent:#8fb0ff;--accent-bg:#1b2540;--on-accent:#0f1318;--ok:#7fd39b;--ok-bg:#15261b;--on-ok:#0f1318;--bad:#ff9a95;--bad-bg:#2d1718;--warn:#f2b26b;--warn-bg:#2a2016;
--c54:#c9a2f5;--c54-bg:#251c33;--c55:#8fb0ff;--c55-bg:#1b2540;--cB:#7fd39b;--cB-bg:#15261b;--cA:#a3adbb;--cA-bg:#222a35;--code:#1d232c;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar .in{max-width:800px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;border:0;background:none;color:var(--ink);padding:8px 0;cursor:pointer;font-size:1rem}
.bar nav{display:flex;gap:2px;margin-left:auto}
.bar nav button{border:0;background:none;color:var(--muted);padding:0 10px;min-height:44px;border-radius:10px;cursor:pointer;font-size:.9rem}
.bar nav button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sub{display:flex;align-items:center;gap:10px;width:100%;font-size:.85rem;color:var(--muted)}
.sub[hidden]{display:none}
.sub .ctx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font:700 .9rem var(--mono);color:var(--ink);white-space:nowrap}
main{max-width:800px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 64px)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:18px;margin:0 0 14px}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:1.45rem;line-height:1.25;margin:4px 0 8px;letter-spacing:-.01em}
h1:focus{outline:none}
h2{font-size:1.18rem;line-height:1.3;margin:4px 0 8px}
h3{font-size:1.02rem;margin:14px 0 6px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;vertical-align:2px;white-space:nowrap}
.t54{background:var(--c54-bg);color:var(--c54)}.t55{background:var(--c55-bg);color:var(--c55)}.tB{background:var(--cB-bg);color:var(--cB)}.tA{background:var(--cA-bg);color:var(--cA)}
.btn{display:block;width:100%;border:0;border-radius:14px;min-height:52px;padding:12px 16px;margin-top:12px;cursor:pointer;font-weight:700;font-size:1rem;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--accent-bg);color:var(--accent)} .btn.go{background:var(--ok);color:var(--on-ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
.meter{height:8px;background:var(--rule);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;border-radius:99px}
.crow{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.88rem}
.hero{display:block;width:100%;text-align:left;border:0;border-radius:18px;padding:18px;margin:14px 0 4px;cursor:pointer;background:var(--ok);color:var(--on-ok)}
.hero b{display:block;font-size:1.12rem;line-height:1.35}.hero span{font-size:.88rem;opacity:.95}
.note{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.93rem}
.note.warn{background:var(--warn-bg)}.note.info{background:var(--accent-bg)}.note.ok{background:var(--ok-bg)}.note.bad{background:var(--bad-bg)}
.rail{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.rail span{font-size:.8rem;font-weight:600;border-radius:99px;padding:5px 11px;background:var(--rule);color:var(--muted)}
.rail span.on{background:var(--accent);color:var(--on-accent)}.rail span.ok{background:var(--ok-bg);color:var(--ok)}
.prog{display:flex;gap:4px;margin:12px 0}.prog i{flex:1;height:5px;border-radius:99px;background:var(--rule)}.prog i.ok{background:var(--ok)}.prog i.on{background:var(--accent)}
.lesson{font-family:var(--serif);font-size:1.07rem;line-height:1.7}
.lesson p{margin:10px 0}
.b-def,.b-thm,.b-formula,.b-example,.b-steps,.b-warn,.b-tip{border-radius:14px;padding:12px 14px;margin:14px 0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:.98rem;line-height:1.6;overflow-x:auto}
.b-def{background:var(--accent-bg)}.b-thm{background:var(--c54-bg)}.b-formula{background:var(--code);font-family:var(--math);font-size:1.12rem;text-align:center}
.b-example{border:1px solid var(--rule);background:var(--surface)}.b-steps{background:var(--code)}.b-warn{background:var(--bad-bg)}.b-tip{background:var(--ok-bg)}
.lab{display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.b-example ol,.b-steps ol{margin:6px 0;padding-left:1.3em}.b-example li,.b-steps li{margin:5px 0}
.ansline{display:block;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--ok-bg);font-weight:600}
ul.b-list{margin:8px 0;padding-left:1.3em}ul.b-list li{margin:4px 0}
.mat{display:inline-table;border-collapse:collapse;margin:8px auto;font-family:var(--math);border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:4px}
.mat td{padding:2px 10px;text-align:center}.mat td.aug{border-left:1px solid var(--ink)}
.mw{text-align:center;overflow-x:auto}
table.tbl{border-collapse:collapse;margin:10px 0;font-size:.92rem;font-family:-apple-system,system-ui,sans-serif}
table.tbl th,table.tbl td{border:1px solid var(--rule);padding:4px 10px;text-align:center}table.tbl th{background:var(--code)}
.tw{overflow-x:auto}
pre.code{background:var(--code);border-radius:12px;padding:12px;overflow-x:auto;font:.86rem/1.5 var(--mono);margin:12px 0}
code{font-family:var(--mono);font-size:.9em;background:var(--code);padding:1px 4px;border-radius:5px;overflow-wrap:anywhere}
details.proof{margin-top:6px}details.proof summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
details.fold{border:1px solid var(--rule);border-radius:14px;padding:10px 14px;margin:10px 0}details.fold summary{cursor:pointer}
.fc .front{font-size:1.15rem;font-weight:600;line-height:1.45;min-height:90px}
.q{font-size:1.03rem;overflow-x:auto}
.q table{border-collapse:collapse;margin:8px 0}.q table.mat td{padding:2px 9px;text-align:center}
.q table.mat{border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.q pre{background:var(--code);border-radius:10px;padding:10px;overflow-x:auto;font-size:.85rem}
.q code{overflow-wrap:anywhere}
input.in,textarea.in{width:100%;font:1.05rem system-ui;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:10px}
textarea.in{min-height:64px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;min-height:44px}
.choice input{margin-top:4px;width:18px;height:18px;flex:none}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{border-radius:12px;padding:12px;margin-top:12px;overflow-x:auto}.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips span{font-size:.75rem;border-radius:99px;padding:3px 9px;background:var(--rule);color:var(--muted)}.chips span.ok{background:var(--ok-bg);color:var(--ok)}.chips span.cur{outline:2px solid var(--accent)}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.grid button{min-width:44px;min-height:44px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.grid button.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.grid button.cur{outline:2px solid var(--accent)}
.pz{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pz button{text-align:left;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:44px;font-size:.95rem;line-height:1.45}
.pz.code button{font-family:var(--mono);font-size:.84rem;white-space:pre-wrap}
.pz.ans{min-height:56px;border:2px dashed var(--rule);border-radius:12px;padding:6px}
.pz.ans button{background:var(--accent-bg)}
details.day{border-top:1px solid var(--rule)}details.day:first-of-type{border-top:0}
details.day summary{cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 2px;font-weight:600;list-style:none;min-height:44px}
details.day summary::-webkit-details-marker{display:none}
details.day summary .r{margin-left:auto;font-weight:400;font-size:.82rem;color:var(--muted)}
.trow{display:flex;gap:8px;align-items:baseline;font-size:.9rem;padding:4px 2px 4px 6px}
.trow .ic{width:18px;flex:none;text-align:center}.trow.done{color:var(--muted)}.trow.cur{font-weight:700}
.empty{text-align:center;padding:28px 10px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .card{max-width:420px;width:100%}
</style>

<body>
<div class="bar"><div class="in">
  <button class="brand" id="brand">Finals Prep</button>
  <nav id="nav"><button data-v="home">Home</button><button data-v="plan">Plan</button><button data-v="mist">Mistakes</button></nav>
  <div class="sub" id="sub" hidden><span class="ctx" id="ctx"></span><span class="clock" id="clock"></span></div>
</div></div>
<main id="main" tabindex="-1"></main>
<div id="ov"></div>
<script src="course.js"></script>
<script src="gen54.js"></script>
<script src="gen55.js"></script>
<script src="gen61b.js"></script>
<script>
"use strict";
// =====================================================================
// Finals Prep — one course for Math 54, Math 55 and CS 61B.
// Nothing is self-reported. Progress comes only from measured study time
// and auto-graded work: freshly generated questions, typed answers,
// and "build the proof/code" problems.
// =====================================================================
const CO=window.COURSE, G=window.GEN||{};
const OVR=new URLSearchParams(location.search).get('date');
const TEST=!!OVR||/\/preview\//.test(location.pathname)&&new URLSearchParams(location.search).has('test');
const KEY=TEST?'finals-v3-test':'finals-v3';
let S={};
try{ S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ S={}; }
const DEF={done:{},doneDay:{},start:{},active:{},check:{},err:[],notes:[],q:null,stage:{},sec:{},seen:{},scroll:{},hp:{},hseen:{},hans:{},hrev:{},hmiss:[],cards:{},rv:{},pz:{},brk:0,lastSeen:0};
for(const [k,v] of Object.entries(DEF)) if(S[k]==null) S[k]=JSON.parse(JSON.stringify(v));
// one-time import of finished tasks from the earlier app
if(!S.imported&&!TEST){ try{ const o=JSON.parse(localStorage.getItem('finals-app-v2')||'{}'); for(const k in (o.done||{})) if(/^[LH]:/.test(k)){ S.done[k]=o.done[k]; } if(Array.isArray(o.err)) S.err=o.err.filter(e=>e&&e.gen); }catch(e){} S.imported=1; }
let DEAD=false;
const save=()=>{ if(DEAD) return; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
// Only one tab may run the app: a newer tab takes over and older tabs stop (no answer-peeking across tabs).
const TAB=Date.now()+Math.random();
function goDead(){ if(DEAD) return; DEAD=true; CUR=null; document.body.innerHTML='<main style="max-width:520px;margin:20vh auto;padding:16px;font-family:system-ui;text-align:center"><h1>Open in another tab</h1><p>Finals Prep runs in one tab at a time so nothing gets lost. Use the other tab, or reload this one to continue here.</p><button onclick="location.reload()" style="min-height:48px;padding:0 18px;border-radius:12px;border:0;background:#1f4cc9;color:#fff;font-weight:700">Use this tab instead</button></main>'; }
try{ const bc=new BroadcastChannel('finals-prep-'+KEY); bc.onmessage=e=>{ if(e.data&&e.data.hello&&e.data.tab!==TAB) goDead(); }; bc.postMessage({hello:1,tab:TAB}); }catch(e){}
addEventListener('storage',e=>{ if(e.key===KEY) goDead(); });
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CN={'54':'Math 54','55':'Math 55','B':'CS 61B','A':'All courses'};
const tag=c=>`<span class="tag t${c}">${CN[c]}</span>`;
const ymd=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
// the study day ends at 4 am, so late-night work counts for the day you started it
const today=()=>{ if(OVR&&/^\d{4}-\d{2}-\d{2}$/.test(OVR)) return OVR; const d=ymd(new Date(Date.now()-4*3600e3)); if(!S.maxDay||d>S.maxDay) S.maxDay=d; return S.maxDay; }; // never goes backwards
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return ymd(x);};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m';};
const clock=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return (s>=3600?Math.floor(s/3600)+':':'')+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const uname=u=>CO.U[u]?CO.U[u].n:u;
const hashStr=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;};

// ---------- tasks & schedule (missed tasks roll over to the next day) ----------
const TASKS=[]; CO.days.forEach(d=>d.tasks.forEach(t=>TASKS.push(Object.assign({d:d.d},t))));
const byKey={}; TASKS.forEach(t=>byKey[t.key]=t);
const real=t=>t.t!=='K';
const exams=TASKS.filter(t=>t.t==='K'&&/FINAL/.test(t.title));
const UNAVAIL={};
const isDone=t=>!!S.done[t.key];
function markDone(t){ S.done[t.key]=Date.now(); S.doneDay[t.key]=today(); save(); }
const doneToday=t=>S.doneDay[t.key]===today();
function todayList(){ const td=today(); return TASKS.filter(t=>real(t)&&t.d<=td&&(!isDone(t)||doneToday(t))); }
function nextTask(){ const td=today(); const l=todayList().find(t=>!isDone(t)&&!UNAVAIL[t.key]); if(l) return {t:l,ahead:false};
  const a=TASKS.find(t=>real(t)&&t.d>td&&!isDone(t)&&!UNAVAIL[t.key]&&(t.t==='L'||t.t==='H'||t.t==='M')); return a?{t:a,ahead:true}:{t:null}; }
const DAILY=10*60; // daily study budget used for the "today's session" view and catch-up projection
function projection(){ const td=today(); let left=TASKS.filter(t=>real(t)&&!isDone(t)&&t.d<=td).reduce((s,t)=>s+t.min,0); let d=td, n=0;
  while(left>DAILY&&n<30){ d=addDays(d,1); n++; left=left-DAILY+TASKS.filter(t=>real(t)&&!isDone(t)&&t.d===d).reduce((s,t)=>s+t.min,0); }
  return n===0?null:d; }

// ---------- content: one uniform format, rendered natively ----------
const CONTENT={};
async function content(u){ if(CONTENT[u]) return CONTENT[u];
  let r; try{ r=await fetch('content/'+u+'.json',{cache:'no-cache'}); }catch(e){ throw {net:true}; }
  if(r.status===404) throw {missing:true}; if(!r.ok) throw {net:true}; return CONTENT[u]=await r.json(); }
function blocks(arr){ return (arr||[]).map(b=>{ switch(b.type){
  case 'p': return `<p>${b.text}</p>`;
  case 'def': return `<div class="b-def"><span class="lab">Definition</span><b>${b.term}.</b> ${b.text}</div>`;
  case 'thm': return `<div class="b-thm"><span class="lab">${b.name||'Theorem'}</span>${b.text}${b.proof?`<details class="proof"><summary>Why it’s true</summary>${blocks(b.proof)}</details>`:''}</div>`;
  case 'formula': return `<div class="b-formula">${b.text}</div>`;
  case 'example': return `<div class="b-example"><span class="lab">Worked example${b.title?' · '+b.title:''}</span><div>${b.prompt}</div><ol>${(b.steps||[]).map(s=>`<li>${s}</li>`).join('')}</ol><span class="ansline">${b.answer}</span></div>`;
  case 'steps': return `<div class="b-steps"><span class="lab">${b.title||'Method'}</span><ol>${b.items.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
  case 'list': return `<ul class="b-list">${b.items.map(s=>`<li>${s}</li>`).join('')}</ul>`;
  case 'warn': return `<div class="b-warn"><span class="lab">Trap</span>${b.text}</div>`;
  case 'tip': return `<div class="b-tip"><span class="lab">Why it works</span>${b.text}</div>`;
  case 'matrix': return `<div class="mw"><table class="mat" role="presentation">${b.rows.map(r=>`<tr>${r.map((x,j)=>`<td class="${b.aug!=null&&j===b.aug?'aug':''}">${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
  case 'table': return `<div class="tw"><table class="tbl"><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
  case 'code': return `<pre class="code">${esc(b.text)}</pre>`;
  default: return ''; } }).join(''); }

// ---------- measured study time ----------
// A second counts while this page is visible and focused. Paper work is fine:
// after 10 minutes with no input the app asks “Still studying?”, and time
// pauses until you answer. Each answer counts as input.
let LAST=Date.now(), CUR=null, SUB=null, NS=0, ASKING=false, BLOCK=0;
const touch=e=>{ if(e&&(!e.isTrusted||e.repeat)) return; if(e&&e.type==='mousemove'&&Math.abs(e.movementX||0)+Math.abs(e.movementY||0)<4) return; LAST=Date.now(); };
['mousemove','keydown','scroll','touchstart','pointerdown','wheel','input'].forEach(e=>addEventListener(e,touch,{passive:true,capture:true}));
setInterval(()=>{ if(!CUR||document.visibilityState!=='visible'||!document.hasFocus()||ASKING) return;
  if(Date.now()-LAST>600000){ askPresence(); return; }
  S.active[CUR]=(S.active[CUR]||0)+1000; if(SUB){ const [m,k]=SUB; S[m][k]=(S[m][k]||0)+1000; }
  BLOCK+=1000; if(++NS%10===0) save(); tickUI();
  if(BLOCK>=50*60000&&VIEW==='task'&&!(S.check[CUR]&&S.check[CUR].phase==='exam')){ BLOCK=0; suggestBreak(); } },1000);
let tickUI=()=>{};

// ---------- question engine ----------
function makeRng(seed){ let a=seed>>>0||1; const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const r={float:f,int:(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)),pick:a=>a[Math.floor(f()*a.length)],bool:()=>f()<.5,shuffle:a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}};
  r.sample=(a,k)=>r.shuffle(a).slice(0,k); return r; }
const seed=()=>{const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0];};
function parseNum(s){ s=String(s).trim().replace(/−/g,'-').replace(/\s+/g,''); if(!s) return NaN;
  let m=s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/); if(m) return parseFloat(m[1])/parseFloat(m[2]);
  if(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)) return parseFloat(s); return NaN; }
function numEq(g0,a0){ const a=typeof a0==='string'?parseNum(a0):a0, g=parseNum(g0); if(!isFinite(g)||!isFinite(a)) return false;
  if(Number.isInteger(a)) return Math.abs(g-a)<1e-9;
  const exact=typeof a0==='string'||Math.abs(a*1e4-Math.round(a*1e4))<1e-7;
  return exact?Math.abs(g-a)<=1e-9*Math.max(1,Math.abs(a)):Math.abs(g-a)<=5e-4*Math.max(1,Math.abs(a)); }
const norm=s=>String(s).toLowerCase().replace(/<[^>]+>/g,'').replace(/[\s·*;]/g,'').replace(/[“”]/g,'"');
function numOK(Q,v,a){ const g=parseNum(v), x=typeof a==='string'?parseNum(a):a; if(!isFinite(g)||!isFinite(x)) return false;
  if(Q.tol!=null) return Math.abs(g-x)<=0.5*Math.pow(10,-Q.tol)+1e-9;
  if(/decimal/i.test(Q.prompt||'')) return Math.abs(g-x)<=5e-4+1e-9;
  if(numEq(v,a)) return true;
  if(!Number.isInteger(x)&&!/exact/i.test(Q.prompt||'')&&/^[+-]?\d*\.\d{3,}$/.test(String(v).trim())) return Math.abs(g-x)<=5e-4; // a decimal for a fraction answer
  return false; }
const cleanList=v=>String(v).replace(/[()\[\]{}⟨⟩]|[a-z]\w*\s*=/gi,'').split(/[,;]+/).map(x=>x.replace(/\s+/g,'')).filter(Boolean);
function grade(Q,v){ switch(Q.kind){
  case 'num': return numOK(Q,String(v).replace(/^[a-z]\w*\s*=/i,''),Q.answer);
  case 'list': { let g=cleanList(v); if(g.length===1&&/\s/.test(String(v).trim())&&Q.answer.length>1) g=String(v).trim().split(/\s+/); const a=Q.answer.slice(); if(g.length!==a.length) return false;
    if(Q.unordered){ const as=a.map(x=>typeof x==='string'?parseNum(x):x).sort((x,y)=>x-y), gs=g.slice().sort((x,y)=>parseNum(x)-parseNum(y)); return gs.every((x,i)=>numOK(Q,x,as[i])); }
    return g.every((x,i)=>numOK(Q,x,a[i])); }
  case 'mc': return Number(v)===Q.answer;
  case 'multi': { const g=(v||[]).slice().sort(), a=Q.answer.slice().sort(); return g.length===a.length&&g.every((x,i)=>x===a[i]); }
  case 'tf': return v===Q.answer;
  case 'text': return (Array.isArray(Q.answer)?Q.answer:[Q.answer]).some(a=>Q.caseSensitive?String(a).replace(/\s+/g,'')===String(v).replace(/\s+/g,''):norm(a)===norm(v)); }
  return false; }
const guessable=Q=>Q.kind==='tf'||(Q.kind==='mc'&&Q.choices.length<=4);
const typesOf=u=>[...new Set((G[u]||[]).map(g=>g.type))];
// A question is stored only as {unit, generator id, seeds}; it is rebuilt when shown and graded, so answers never sit in saved data.
function qFrom(sp){ if(!sp) return null; if(sp.pz) return pzFrom(sp); const g=(G[sp.u]||[]).find(x=>x.id===sp.g); if(!g) return null;
  try{ const Q=g.make(makeRng(sp.s1)); if(!Q||!Q.prompt) return null; Q.gen=g.id; Q.unit=sp.u; Q.type=g.type; if(Q.kind==='mc') Q.order=makeRng(sp.s2).shuffle(Q.choices.map((c,i)=>i)); return Q; }catch(e){ return null; } }
function makeSpec(u,type,gid){ let gs=(G[u]||[]).filter(g=>gid?g.id===gid:(!type||g.type===type)); if(!gs.length) gs=(G[u]||[]).filter(g=>!type||g.type===type); if(!gs.length) return null;
  for(let i=0;i<25;i++){ const g=makeRng(seed()).pick(gs), sp={u,g:g.id,s1:seed(),s2:seed()}; if(qFrom(sp)) return sp; } return null; }
function makeQ(u,type,gid){ return qFrom(makeSpec(u,type,gid)); }
function logMiss(Q){ const d=today(); S.err.push({id:'e'+Date.now()+Math.random(),unit:Q.unit,gen:Q.gen,type:Q.type,d,due:addDays(d,2),cleared:false,hits:0});
  S.err.push({id:'f'+Date.now()+Math.random(),unit:Q.unit,gen:Q.gen,type:Q.type,d,due:addDays(d,7),cleared:false,hits:0}); }
function inputHTML(Q,name,v){
  if(Q.kind==='mc') return Q.order.map(i=>`<label class="choice"><input type="radio" name="${name}" value="${i}" ${v!=null&&String(v)===String(i)?'checked':''}><span>${Q.choices[i]}</span></label>`).join('');
  if(Q.kind==='multi') return Q.choices.map((c,i)=>`<label class="choice"><input type="checkbox" name="${name}" value="${i}" ${(v||[]).includes(i)?'checked':''}><span>${c}</span></label>`).join('')+`<label class="choice"><input type="checkbox" name="${name}" value="none" ${Array.isArray(v)&&!v.length?'checked':''}><span><i>None of these</i></span></label>`;

  return `<input class="in" id="${name}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(v==null?'':v)}" placeholder="${Q.kind==='list'?'comma-separated, e.g. 3, -1/2, 4':Q.kind==='num'?'a number or fraction like -7/3':'your answer'}" aria-label="Your answer">`; }
function readInput(Q,name){
  if(Q.kind==='mc'){ const c=document.querySelector(`input[name="${name}"]:checked`); return c?c.value:null; }

  const el=$(name); const v=el?el.value:''; return v.trim()?v:null; }

// ---------- what each check asks ----------
function learned(){ const m={}; TASKS.forEach(t=>{ if(t.t==='L'&&isDone(t)) m[t.u]=S.doneDay[t.key]||ymd(new Date(S.done[t.key])); }); return m; }
function reviewUnits(t){ if(S.rv[t.key]) return S.rv[t.key]; const td=today(), L=learned();
  const near=k=>[2,3,4,6,7,8,13,14,15,20,21,22].includes(k);
  let us=Object.keys(L).filter(u=>near(daysBetween(L[u],td)));
  if(!us.length) us=Object.keys(L).filter(u=>daysBetween(L[u],td)>=1);
  if(!us.length) us=Object.keys(L).slice(-3);
  us=makeRng(hashStr(t.key)).shuffle(us).slice(0,10); if(us.length){ S.rv[t.key]=us; save(); } return us; }
const inCourse=(c,u)=>c==='A'||u.startsWith(c==='B'?'B-':c+'-');
function weakUnits(t,n){ if(S.rv[t.key]) return S.rv[t.key]; const c=t.c, cnt={};
  S.err.filter(e=>inCourse(c,e.unit)).forEach(e=>cnt[e.unit]=(cnt[e.unit]||0)+1);
  let w=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,n); const L=Object.keys(learned()).filter(u=>inCourse(c,u)&&!w.includes(u));
  w=w.concat(makeRng(hashStr(t.key)).sample(L,Math.max(0,n-w.length))); if(w.length){ S.rv[t.key]=w; save(); } return w; }
function courseUnits(c){ const pre=c==='B'?'B-':c+'-'; return Object.keys(CO.U).filter(u=>u.startsWith(pre)); }
function reqsFor(t){ const R=[], r=makeRng(hashStr(t.key));
  const add=(u,need,max)=>{ let ts=typesOf(u); if(max) ts=r.sample(ts,Math.min(max,ts.length)); ts.forEach(ty=>R.push({unit:u,type:ty,need})); };
  const errs=c=>S.err.filter(e=>!e.cleared&&e.gen&&e.due<=today()&&inCourse(c,e.unit)).sort((a,b)=>a.due<b.due?-1:1).slice(0,14).forEach(e=>R.push({unit:e.unit,type:e.type,need:1,gid:e.gen,err:e.id}));
  if(t.t==='L') add(t.u,1);
  else if(t.t==='H') add(t.u,2);
  else if(t.t==='R'){ reviewUnits(t).forEach(u=>add(u,1,2)); errs('A'); }
  else if(t.t==='T'){ errs(t.c); weakUnits(t,/Note sheet/.test(t.title)?6:3).forEach(u=>add(u,1,2)); }
  else if(t.t==='W'){ courseUnits(t.c).forEach(u=>add(u,1)); errs(t.c); }
  else if(t.t==='M'){ const C=S.check[t.key]; (C.missedSpecs||[]).forEach(sp=>R.push({unit:sp.u,type:'',need:1,gid:sp.g})); (C.missed||[]).forEach(u=>add(u,1,2)); }
  return R; }
const rk=r=>r.unit+'|'+(r.type||'')+'|'+(r.gid||'')+'|'+(r.err||'');

function finish(t,nx){ markDone(t); delete S.check[t.key]; S.q=null; save();
  const nn=nextTask(), list=todayList(), left=list.filter(x=>!isDone(x)).reduce((s,x)=>s+x.min,0);
  chrome(`${tag(t.c)} ${esc(t.title)}`,false);
  $('main').innerHTML=`<div class="card"><div class="note ok"><b>Passed ✓</b> ${esc(t.title)}</div>
    <p class="small muted">${list.filter(isDone).length} of ${list.length} done today${left?' · about '+fm(left)+' left':''}.</p>
    ${!left&&!nn.ahead?'':''}${nn.t?`<button class="hero" id="cont"><b>▶ Next: ${esc(nn.t.title)}</b><span>${CN[nn.t.c]} · about ${fm(nn.t.min)}${nn.ahead?' · today’s work is done; this is working ahead':''}</span></button>`:'<div class="note ok">Everything due is done.</div>'}
    <button class="btn ghost" id="hm">Back to home</button></div>`;
  if($('cont')) $('cont').onclick=()=>{ render(); window.scrollTo(0,0); }; $('hm').onclick=()=>go('home'); focusMain(); }

// ----- timed exam: built from every unit covered so far, weighted like the final, graded by the app -----
const POST={'54':['54-10','54-11','54-12','54-13','54-14']};
function examPool(t){ const pre=t.c==='B'?'B-':t.c+'-'; const L={}; TASKS.forEach(x=>{ if(x.t==='L'&&x.u.startsWith(pre)&&x.d<=t.d) L[x.u]=1; }); return Object.keys(L).filter(u=>(G[u]||[]).length); }
const examN=t=>Math.max(8,Math.round(t.min/6));
async function buildExam(t){ const pool=examPool(t), n=examN(t), r=makeRng(seed()), qs=[];
  // weights: every unit at least once; Math 54 post-Midterm-2 units carry half the exam when present
  const w={}; pool.forEach(u=>w[u]=1); const post=(POST[t.c]||[]).filter(u=>pool.includes(u));
  if(post.length){ const pre=pool.length-post.length; post.forEach(u=>w[u]=Math.max(1,pre/post.length)); }
  const tot=pool.reduce((s,u)=>s+w[u],0), quota={}; pool.forEach(u=>quota[u]=Math.max(1,Math.round(n*w[u]/tot)));
  for(const u of r.shuffle(pool)){ const ts=r.shuffle(typesOf(u)); for(let k=0;k<quota[u];k++){ const sp=makeSpec(u,ts[k%ts.length]); if(sp) qs.push(sp); } }
  // written part: build-the-proof/code problems from covered units
  const pz=[]; for(const u of r.shuffle(pool)){ if(pz.length>=2) break; try{ const D=await content(u); if(D.parsons&&D.parsons.length){ const pi=r.int(0,D.parsons.length-1); pz.push({unit:u,pi}); } }catch(e){} }
  pz.forEach(x=>qs.push({pz:1,u:x.unit,pi:x.pi,s1:seed()}));
  return r.shuffle(qs); }
function pzFrom(sp){ const D=CONTENT[sp.u]; if(!D||!D.parsons||!D.parsons[sp.pi]) return null; const p=D.parsons[sp.pi], all=p.lines.concat(p.distractors), code=sp.u.startsWith('B-');
  return {kind:'pz',unit:sp.u,prompt:`<b>${p.title}</b><p>${p.goal}</p>`,lines:p.lines,all,order:makeRng(sp.s1).shuffle(all.map((a,k)=>k)),code,solution:'<ol>'+p.lines.map(l=>`<li>${code?'<code>'+esc(l)+'</code>':l}</li>`).join('')+'</ol>'}; }
async function exam(t,nx){ let C=S.check[t.key];
  if(C&&C.qs){ for(const u of [...new Set(C.qs.filter(q=>q.pz).map(q=>q.u))]){ try{ await content(u); }catch(e){} } }
  if(!C){ const pool=examPool(t); $('clock').textContent='';
    $('main').innerHTML=`<div class="card">${head(t,nx)}${(S.retake||{})[t.key]?`<div class="note warn">Retake ${(S.retake||{})[t.key]}: new questions, same 85% bar.</div>`:''}<p><b>About ${examN(t)+2} questions · ${fm(t.min)} · ${pool.length} units</b>, weighted like the real final, plus build-the-proof/code problems.</p>
      <ul class="b-list"><li>Closed notes${t.c==='54'?' (except your one handwritten note sheet once you’ve written it)':''}, scratch paper, phone away.</li><li>No feedback until you submit. Your answers save as you type. It submits itself when time runs out.</li><li>Pass mark 85%. Below that you must pass a repair check on every unit you missed.</li><li>Every miss comes back in 2 and 7 days.</li></ul>
      <button class="btn" id="go">Start the exam: the timer starts now</button></div>`;
    $('go').onclick=async()=>{ $('go').disabled=true; const qs=await buildExam(t); if(qs.length<5){ $('go').outerHTML='<div class="note bad">The exam questions didn’t load. Reload the page.</div>'; return; } S.start[t.key]=Date.now(); S.check[t.key]={phase:'exam',qs,ans:{},i:0,end:Date.now()+t.min*60000}; save(); render(); }; focusMain(); return; }
  if(C.phase==='check'){ CUR=t.key; return checkView(t,nx); }
  if(C.phase==='exam'&&Date.now()>=C.end){ gradeExam(t); C.expired=true; save(); }
  if(C.phase==='result'){ const n=C.qs.length, pass=C.score/n>=.85; $('clock').textContent='';
    $('main').innerHTML=`<div class="card">${head(t,nx)}${C.expired?'<div class="note warn">Time ran out, so it was graded with your saved answers.</div>':''}<h2>${C.score} / ${n} · ${Math.round(100*C.score/n)}%</h2>
      <div class="note ${pass?'ok':'warn'}">${pass?'Passed. Study every miss below; each returns in 2 and 7 days with new numbers.':'Below 85%. Next: a repair check on exactly what you missed, then a retake with new questions. Solutions stay hidden until you pass.'}</div>
      ${C.qs.map((sp,j)=>{ const Q=qFrom(sp)||{prompt:'',unit:sp.u}; return `<details class="fold" ${C.res[j]?'':(pass?'open':'')}><summary><b>${C.res[j]?'✓':'✗'} Question ${j+1}</b> <span class="muted small">· ${esc(uname(Q.unit))}</span></summary>${pass?`<div class="q">${Q.prompt}</div><div class="fb ${C.res[j]?'ok':'bad'}"><b>Solution:</b> ${Q.solution||''}</div>`:''}</details>`; }).join('')}
      <button class="btn" id="nx">${pass?'Finish':'Start the repair check'}</button></div>`;
    $('nx').onclick=()=>{ if(pass) return finish(t,nx); const m=C.missed, ms=C.qs.filter((sp,j)=>!C.res[j]&&!sp.pz); S.check[t.key]={phase:'check',missed:m,missedSpecs:ms,streak:{},asked:0,wrong:0,round:1,ra:0,rw:0}; S.check[t.key].reqs=reqsFor(t); S.q=null; save(); render(); };
    focusMain(); return; }
  CUR=t.key; const j=Math.min(C.i,C.qs.length-1), Q=qFrom(C.qs[j]);
  if(!Q){ $('main').innerHTML=`<div class="card">${head(t,nx)}<div class="note bad">This question didn’t load. Reload the page; your answers are saved.</div></div>`; return; }
  const body=Q.kind==='pz'?(()=>{ const pick=C.ans[j]||[]; return `<p class="small muted">Tap lines in order; leave the wrong ones out.</p><div class="pz ans ${Q.code?'code':''}" id="pa">${pick.map((k,i)=>`<button type="button" data-j="${i}">${Q.code?esc(Q.all[k]):Q.all[k]}</button>`).join('')||'<span class="small muted" style="padding:8px">Nothing yet.</span>'}</div><div class="pz ${Q.code?'code':''}" id="pl">${Q.order.filter(k=>!pick.includes(k)).map(k=>`<button type="button" data-k="${k}">${Q.code?esc(Q.all[k]):Q.all[k]}</button>`).join('')}</div>`; })():inputHTML(Q,'ea'+j,C.ans[j]);
  $('main').innerHTML=`<div class="card">${head(t,nx)}<div class="kicker">Question ${j+1} of ${C.qs.length} · answers save as you go</div>
    <div class="q"><div class="small muted">${esc(uname(Q.unit))}</div>${Q.prompt}</div>${body}
    <div class="row"><button class="btn ghost" id="pv" ${j===0?'disabled':''}>← Previous</button><button class="btn" id="nx">${j<C.qs.length-1?'Next →':'Review'}</button></div>
    <div class="grid">${C.qs.map((q,k)=>`<button data-k="${k}" class="${C.ans[k]!=null&&!(Array.isArray(C.ans[k])&&!C.ans[k].length&&q.pz)?'ok':''} ${k===j?'cur':''}" aria-label="Question ${k+1}${C.ans[k]!=null?', answered':''}">${k+1}</button>`).join('')}</div>
    <button class="btn ghost" id="sb">Submit the exam</button></div>`;
  const keep=()=>{ if(Q.kind==='pz') return; const v=readInput(Q,'ea'+j); if(v==null) delete C.ans[j]; else C.ans[j]=v; save(); };
  if(Q.kind==='pz'){ document.querySelectorAll('#pl button').forEach(b=>b.onclick=()=>{ (C.ans[j]=C.ans[j]||[]).push(+b.dataset.k); save(); render(); });
    document.querySelectorAll('#pa button').forEach(b=>b.onclick=()=>{ C.ans[j].splice(+b.dataset.j,1); save(); render(); }); }
  document.querySelectorAll('#main input').forEach(x=>{ x.addEventListener('input',keep); x.addEventListener('change',keep); });
  $('pv').onclick=()=>{ keep(); C.i=j-1; save(); render(); }; $('nx').onclick=()=>{ keep(); C.i=Math.min(j+1,C.qs.length-1); save(); render(); };
  document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{ keep(); C.i=+b.dataset.k; save(); render(); });
  $('sb').onclick=()=>{ keep(); const un=C.qs.filter((q,k)=>C.ans[k]==null||(q.pz&&!C.ans[k].length)).length; if(!confirm(un?`${un} unanswered (they count as wrong). Submit?`:'Submit the exam?')) return; gradeExam(t); render(); };
  const draw=()=>{ const rem=C.end-Date.now(); if(rem<=0){ keep(); clearInterval(TICK); gradeExam(t); C.expired=true; save(); return render(); } $('clock').textContent=clock(rem)+' left'; };
  draw(); TICK=setInterval(draw,1000); }
function gradeExam(t){ const C=S.check[t.key]; let ok=0; const miss=new Set();
  C.res=C.qs.map((sp,j)=>{ const Q=qFrom(sp), v=C.ans[j]; let g=false;
    if(Q&&Q.kind==='pz') g=Array.isArray(v)&&v.length===Q.lines.length&&v.every((k,i)=>k===i);
    else if(Q) g=v!=null&&grade(Q,v);
    if(g) ok++; else { miss.add(sp.u); if(Q&&Q.kind!=='pz') logMiss(Q); } return g; });
  C.score=ok; C.missed=[...miss]; C.phase='result'; S.notes.push({d:today(),key:t.key,title:t.title,pts:ok,tot:C.qs.length}); save(); }

render();
</script>
